name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trading-backtest-engine
        uses: actions/checkout@v4
        with:
          path: trading-backtest-engine

      - name: Checkout trading-strategies
        uses: actions/checkout@v4
        with:
          repository: supanut9/trading-strategies
          path: trading-strategies

      - name: Checkout trading-data-pipeline
        uses: actions/checkout@v4
        with:
          repository: supanut9/trading-data-pipeline
          path: trading-data-pipeline

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: trading-backtest-engine
        run: uv sync --all-extras

      - name: Lint with ruff
        working-directory: trading-backtest-engine
        run: uv run ruff check src/ tests/

      - name: Format check with ruff
        working-directory: trading-backtest-engine
        run: uv run ruff format --check src/ tests/

      - name: Type check with mypy
        working-directory: trading-backtest-engine
        run: uv run mypy src/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout trading-backtest-engine
        uses: actions/checkout@v4
        with:
          path: trading-backtest-engine

      - name: Checkout trading-strategies
        uses: actions/checkout@v4
        with:
          repository: supanut9/trading-strategies
          path: trading-strategies

      - name: Checkout trading-data-pipeline
        uses: actions/checkout@v4
        with:
          repository: supanut9/trading-data-pipeline
          path: trading-data-pipeline

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: trading-backtest-engine
        run: uv sync --all-extras

      - name: Run tests
        working-directory: trading-backtest-engine
        run: uv run pytest tests/ -v --tb=short --cov=src/ --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: trading-backtest-engine/htmlcov/
